<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/grocery-icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#006e1c" />
        <meta name="apple-mobile-web-app-title" content="FreshDrop" />
        <meta name="application-name" content="FreshDrop" />

        <!-- Primary Meta Tags -->
        <title>Fresh Drop | Shop Local Produce & Supermarket Goods</title>
        <meta
            name="description"
            content="FreshDrop brings supermarkets and local markets closer to your kitchen. Build a basket in minutes, discover what is available nearby, and get it delivered without the queue."
        />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.freshdop.co.ke/" />
        <meta
            property="og:title"
            content="FreshDrop | Shop Local Produce & Supermarket Goods"
        />
        <meta
            property="og:description"
            content="From Quickmart staples to Machakos open market fresh produce. One account for your basket, address, and delivery updates."
        />
        <meta
            property="og:image"
            content="https://www.freshdop.co.ke/og-image.jpeg"
        />
        <meta property="og:site_name" content="FreshDrop" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="FreshDrop | Your Everyday Market, Delivered Fresh"
        />
        <meta
            name="twitter:description"
            content="Build a basket in minutes and get fresh produce and supermarket goods delivered to your doorstep."
        />
        <meta
            name="twitter:image"
            content="https://www.freshdop.co.ke/og-image.png"
        />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://www.freshdop.co.ke/" />

        <!-- Google Fonts: Inter & Caveat -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
            rel="stylesheet"
        />
        <!-- Material Symbols Outlined -->
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet"
        />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "OnlineStore",
                "name": "FreshDrop",
                "url": "https://www.freshdop.co.ke",
                "logo": "https://www.freshdop.co.ke/grocery-icon.png",
                "description": "FreshDrop brings supermarkets and local markets closer to your kitchen. Build a basket in minutes and get it delivered.",
                "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Machakos",
                    "addressRegion": "Machakos County",
                    "addressCountry": "KE"
                },
                "contactPoint": {
                    "@type": "ContactPoint",
                    "contactType": "customer service",
                    "email": "support@freshdop.co.ke"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
